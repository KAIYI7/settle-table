name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: false
      - name: Runtime versions
        run: python -c "import sys, sqlite3; print(sys.version); print(sqlite3.sqlite_version)"
      - name: All calculator, authority and security tests
        run: python -m unittest discover -s tests -v
      - name: Real browser end-to-end journey tests (Chrome CDP)
        run: node tools/e2e_browser_test.mjs
      - name: Financial scope and mock export browser regression
        run: node tools/verify_financial_export.mjs
      - name: Allocation conflict recovery browser regression
        run: node tools/verify_conflict_recovery.mjs
      - name: Multi-payer contributions and funding browser regression
        run: node tools/verify_multi_payer_flow.mjs
      - name: Peer transfers and settlement tracking browser regression
        run: node tools/verify_peer_settlement_flow.mjs
      - name: Numeric stepper and financial UX clarity browser regression
        run: node tools/verify_ux_polish.mjs
      - name: Complimentary zero-priced items browser regression
        run: node tools/verify_complimentary_items_flow.mjs
      - name: Context-aware workflow navigation and focus browser regression
        run: node tools/verify_context_aware_navigation.mjs
