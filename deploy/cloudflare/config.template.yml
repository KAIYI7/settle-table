# ==============================================================================
# SettleTable — Cloudflare Named Tunnel Inactive Configuration Template
# ==============================================================================
# NOTICE:
# Remotely-managed tunnels (configured via Cloudflare Zero Trust dashboard with a
# tunnel token) are the RECOMMENDED approach for SettleTable, eliminating local
# credentials files and keeping routing configuration unified on Cloudflare's edge.
#
# This file is an offline template for operators who explicitly choose
# LOCALLY-MANAGED tunnels via CLI (`cloudflared tunnel create <name>`).
#
# DO NOT COMMIT REAL CREDENTIALS, UUIDs, OR DOMAIN NAMES TO VERSION CONTROL.
# ==============================================================================

# 1. Tunnel Identifier (UUID generated by: cloudflared tunnel create settletable)
tunnel: 00000000-0000-0000-0000-000000000000

# 2. Path to the credentials JSON file downloaded during tunnel creation
# For Docker Compose: mount into container at /etc/cloudflared/credentials.json
# For Windows host service: %USERPROFILE%\.cloudflared\<UUID>.json
credentials-file: /etc/cloudflared/credentials.json

# 3. Ingress Routing Rules
# Rules are evaluated top-down; the first matching rule applies.
# A final catch-all rule (without hostname) is mandatory.
ingress:
  # Route traffic for SettleTable public hostname (confirmed: settle.kybuilds.com)
  - hostname: settle.kybuilds.com
    # Topology A (Recommended - Docker Compose bridge network):
    service: http://settletable:8000
    # Topology B (Alternative - Windows host service or loopback):
    # service: http://127.0.0.1:8000
    originRequest:
      # SettleTable runs standard HTTP internally behind the edge TLS tunnel
      noTLSVerify: false
      connectTimeout: 30s
      noChunkedEncoding: false

  # Mandatory catch-all rule: reject unmatched hostnames with 404
  - service: http_status:404
