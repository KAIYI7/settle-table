# ==============================================================================
# SettleTable Reference Nginx Configuration (Tier 1 Ingress Boundary)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Wire limits & TCP stream protection (Slowloris mitigation)
    client_max_body_size 10M;           # Permits 5MB receipt images + form overhead
    client_body_buffer_size 128k;
    large_client_header_buffers 4 8k;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Upstream WSGI server
    upstream settletable_backend {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name settletable.example.com;

        # Redirect plain HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name settletable.example.com;

        # TLS certificates
        ssl_certificate     /etc/ssl/certs/settletable.crt;
        ssl_certificate_key /etc/ssl/private/settletable.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Ingress Security Boundary: Block external access to /bootstrap
        location ~* ^/api/meals/[^/]+/bootstrap$ {
            # Allow only internal loopback administrative calls
            allow 127.0.0.1;
            allow ::1;
            deny all;

            proxy_pass http://settletable_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Healthcheck endpoint
        location = /healthz {
            proxy_pass http://settletable_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # Public application traffic
        location / {
            proxy_pass http://settletable_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;
        }
    }
}
