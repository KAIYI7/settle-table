<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SettleTable — Fair & Simple Dining Bill Splitting</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner container">
      <div class="header-left">
        <a href="#/" class="brand-link" title="SettleTable Home">
          <svg class="brand-icon" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="#4f46e5"/>
            <path d="M8 10h16M8 16h10M8 22h14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="23" cy="16" r="3" fill="#10b981"/>
          </svg>
          <span class="brand-title">SettleTable</span>
        </a>
        <a href="#/" id="nav-home-btn" class="nav-link" title="Return to Home Screen">Home</a>
      </div>
      <div id="header-user-status" class="header-status"></div>
    </div>
  </header>

  <div id="alert-container" aria-live="polite" aria-atomic="true"></div>

  <main id="app" class="container" role="main">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading SettleTable...</p>
    </div>
  </main>

  <!-- Fullscreen / Zoom Receipt Photo Viewer Modal -->
  <div id="receipt-modal" class="receipt-modal" role="dialog" aria-modal="true" aria-labelledby="receipt-modal-title" style="display: none;">
    <div class="receipt-modal-backdrop" id="receipt-modal-backdrop"></div>
    <div class="receipt-modal-card">
      <div class="receipt-modal-header">
        <div class="receipt-modal-title" id="receipt-modal-title">🔍 Original Receipt Photo</div>
        <div class="receipt-modal-controls">
          <button type="button" class="btn btn-secondary btn-sm" id="receipt-zoom-out" aria-label="Zoom out">−</button>
          <span id="receipt-zoom-level" class="receipt-zoom-level">100%</span>
          <button type="button" class="btn btn-secondary btn-sm" id="receipt-zoom-in" aria-label="Zoom in">+</button>
          <button type="button" class="btn btn-secondary btn-sm" id="receipt-zoom-reset">Reset</button>
          <button type="button" class="btn btn-secondary btn-sm receipt-modal-close-btn" id="receipt-modal-close" aria-label="Close photo viewer">✕</button>
        </div>
      </div>
      <div class="receipt-modal-viewport" id="receipt-modal-viewport">
        <img id="receipt-modal-img" class="receipt-modal-img" alt="Scanned receipt source" />
      </div>
      <div class="receipt-modal-footer">
        <span>Drag image to pan &bull; Use buttons or mouse wheel to zoom &bull; Esc to close</span>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="container footer-content">
      <span>SettleTable &bull; Fair Bill Splitting</span>
      <span class="footer-note">Exact to the cent &bull; Private &bull; No app install required</span>
    </div>
  </footer>
</body>
</html>
