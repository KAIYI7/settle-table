# ==============================================================================
# SettleTable Docker Compose (Single-Instance Production / Self-Hosted)
# ==============================================================================
# Features:
# - Single-instance WSGI app with pinned persistent volume
# - Non-root execution
# - Loopback port binding (or optional Caddy TLS reverse proxy / Cloudflare Tunnel)

services:
  settletable:
    build:
      context: .
      dockerfile: Dockerfile
    image: settletable:latest
    container_name: settletable_app
    restart: unless-stopped
    ports:
      # Bind to loopback interface so reverse proxy, tunnel, or host CLI can reach the app
      - "127.0.0.1:8000:8000"
    volumes:
      # Persistent volume for SQLite WAL database and receipt photos
      - settletable_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - SETTLETABLE_DB_PATH=/data/settletable.sqlite
      - SETTLETABLE_STORAGE_DIR=/data/receipt_photos
      - SETTLETABLE_SERVER_ORIGIN=${SETTLETABLE_SERVER_ORIGIN:-http://localhost:8000}
      - SETTLETABLE_ALLOWED_HOSTS=${SETTLETABLE_ALLOWED_HOSTS:-localhost:8000,127.0.0.1:8000,localhost,127.0.0.1}
      - SETTLETABLE_SESSION_TTL=${SETTLETABLE_SESSION_TTL:-604800}
      - SETTLETABLE_ALLOW_SYNC_EXPORT=${SETTLETABLE_ALLOW_SYNC_EXPORT:-0}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # Optional Cloudflare Named Tunnel connector (remotely managed via token)
  # Recommended for self-hosted MVP deployments behind custom domain.
  # Reaches settletable container on the shared Compose network at http://settletable:8000.
  # Enable with: docker compose --profile with-cloudflared up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: settletable_tunnel
    restart: unless-stopped
    profiles:
      - with-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      settletable:
        condition: service_healthy

  # Optional Caddy reverse proxy for automated Let's Encrypt TLS (alternative to Cloudflare)
  # Enable with: docker compose --profile with-caddy up -d
  caddy:
    image: caddy:2.8-alpine
    container_name: settletable_caddy
    restart: unless-stopped
    profiles:
      - with-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      settletable:
        condition: service_healthy

volumes:
  settletable_data:
    name: settletable_data
  caddy_data:
  caddy_config:
